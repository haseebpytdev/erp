name: Sidebar Composer Validation

on:
  workflow_dispatch:

jobs:
  php-behavioral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, xml
          coverage: none
      - name: Run sidebar behavioral regression
        run: php tests/release/server-sidebar-composer-regression.php
